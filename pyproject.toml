[project]
name = "fuobe-connect"
description = "Use this ComfyUI from Fuobe with one install: no start flag, no extra file. Trusts only the Fuobe studios you name, checks every workflow they send against the node list it ships, keeps ComfyUI's own check for every other website, and can pair with your Fuobe account for Safari, phones and PCs with no screen."
version = "1.0.2"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# aiohttp comes with ComfyUI: naming it here could make ComfyUI-Manager change ComfyUI's own copy.
dependencies = []
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Homepage = "https://fuobe.com"
Repository = "https://github.com/workingprototype/ComfyUI-Fuobe-Connect"
Documentation = "https://github.com/workingprototype/ComfyUI-Fuobe-Connect#readme"
Issues = "https://github.com/workingprototype/ComfyUI-Fuobe-Connect/issues"

# Read by the Comfy Registry (https://registry.comfy.org), which ComfyUI-Manager searches.
[tool.comfy]
PublisherId = "workingprototype"
DisplayName = "Fuobe Connect"
# 400 x 400 PNG in this repository; .comfyignore keeps it out of the published pack.
Icon = "https://raw.githubusercontent.com/workingprototype/ComfyUI-Fuobe-Connect/main/assets/icon.png"
requires-comfyui = ">=0.3.0"
includes = []
